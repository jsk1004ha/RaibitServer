production: false
nameOverride: ""
fullnameOverride: ""
image:
  registry: registry.raibitserver.local
  tag: latest
  pullPolicy: IfNotPresent
  digests:
    api: ""
    dashboard: ""
    orchestrator: ""
    builder: ""
    provisioner: ""
    logIngester: ""
    metricsIngester: ""
database:
  existingSecret: raibitserver-control-plane-database
  urlKey: DATABASE_URL
runtimeSecrets:
  existingSecret: raibitserver-api-runtime
api:
  replicas: 2
  port: 3000
  resources:
    requests: { cpu: 100m, memory: 128Mi }
    limits: { cpu: 500m, memory: 512Mi }
  pdb:
    enabled: true
    maxUnavailable: 1
  autoscaling:
    enabled: false
    minReplicas: 2
    maxReplicas: 10
    targetCPUUtilizationPercentage: 70
dashboard:
  enabled: true
  consoleUrl: ""
  replicas: 2
  port: 3000
  resources:
    requests: { cpu: 100m, memory: 128Mi }
    limits: { cpu: 500m, memory: 512Mi }
  pdb:
    enabled: true
    maxUnavailable: 1
  autoscaling:
    enabled: false
    minReplicas: 2
    maxReplicas: 10
    targetCPUUtilizationPercentage: 70
hostedErrors:
  enabled: true
  # Application-owned 404 pages stay intact. The platform intercepts only
  # infrastructure failures; unmatched tenant hostnames use fallbackIngress.
  statuses:
    - "500"
    - "502"
    - "503"
    - "504"
  fallbackIngress:
    enabled: true
    host: ""
    annotations:
      traefik.ingress.kubernetes.io/router.priority: "1"
    tls:
      # Empty reuses ingress.tls.existingSecret. The effective Secret must
      # include the wildcard host used by this fallback Ingress.
      existingSecret: ""
  traefik:
    # Requires Traefik v3.7.8+ CRDs and cross-namespace middleware access.
    enabled: false
orchestrator:
  replicas: 1
  execute: false
  reconcileIntervalSeconds: 5
builder:
  # Local/default installs keep external build infrastructure disabled. A
  # production release must set this to exactly 1; dispatcher sessions are
  # in-memory and intentionally fail closed across dispatcher restarts.
  replicas: 0
  registry: registry.raibitserver.app
  push: true
  buildTimeoutSeconds: 600
  # The trusted dispatcher is the only builder component that receives the
  # control-plane DSN. Disposable executors reach it over mTLS and never receive
  # database credentials or database NetworkPolicy egress.
  dispatch:
    port: 8443
    requestTimeoutSeconds: 30
    sessionTTLSeconds: 900
    existingSecret: ""
    caKey: ca.crt
    serverCertificateKey: server.crt
    serverKeyKey: server.key
    clientCertificateKey: client.crt
    clientKeyKey: client.key
    resources:
      requests: { cpu: 50m, memory: 64Mi }
      limits: { cpu: 250m, memory: 256Mi }
  databaseEgress:
    port: 5432
    selectorPeers:
      - podSelector:
          app.kubernetes.io/name: raibitserver-postgres
    cidrs: []
  runtimeClassName: gvisor
  buildkitImage: moby/buildkit:v0.30.0-rootless
  buildkitDigest: ""
  # Every scheduled batch creates a bounded set of disposable executor Pods.
  # Each Pod claims at most one control-plane job through the dispatcher, and
  # its native BuildKit sidecar dies with that Pod. Overlapping batches are
  # forbidden by the CronJob template, so active executors stay bounded by
  # parallelism.
  isolation:
    mode: single-job-pod
    schedule: "* * * * *"
    parallelism: 4
    completions: 4
    startingDeadlineSeconds: 30
    activeDeadlineSeconds: 780
    ttlSecondsAfterFinished: 300
    successfulJobsHistoryLimit: 1
    failedJobsHistoryLimit: 3
  # Production must provide published immutable references. Local dry-run keeps
  # these empty and uses the documented mutable development fallback only.
  generatedDockerfile:
    frontend: ""
    nodeImage: ""
  workspaceSizeLimit: 20Gi
  buildkitStateSizeLimit: 20Gi
  ephemeralStorage:
    builderRequest: 1Gi
    builderLimit: 10Gi
    buildkitRequest: 2Gi
    buildkitLimit: 20Gi
    # Compatibility key: bounds the per-Pod BuildKit mTLS volumes.
    socketSizeLimit: 64Mi
    workSizeLimit: 1Gi
    # Trivy downloads and expands its vulnerability database under HOME=/tmp.
    # Keep scanner scratch space separate from BuildKit's smaller tmp volume.
    builderTmpSizeLimit: 4Gi
    metadataSizeLimit: 256Mi
  # The broker token only authorizes minting one short-lived credential for the
  # server-derived output repository. A registry-wide Docker config is forbidden.
  registryCredentials:
    brokerURL: ""
    existingSecret: ""
    tokenKey: token
    minTTLSeconds: 840
    maxTTLSeconds: 900
    # Split-DNS registry endpoints terminate TLS on a dedicated broker gateway
    # Pod. The executor may reach only this namespace/pod identity and port;
    # shared ingress-controller or private-CIDR exceptions are forbidden.
    privateGateway:
      enabled: false
      namespace: ""
      podName: ""
      servicePort: 443
      port: 8443
  # Only the trusted dispatcher receives this GitHub App identity. It mints a
  # short-lived token scoped to the exact repository requested by one claimed
  # executor session; the private key is never mounted in executor Pods.
  githubAppCredentials:
    enabled: false
    existingSecret: ""
    appIdKey: app-id
    privateKeyKey: private-key.pem
    apiURL: https://api.github.com
  # Anonymous clones are limited to uncredentialed HTTPS github.com URLs.
  # Private repositories use the dispatcher broker above and remain fail-closed
  # whenever it is disabled or its exact-repository authorization is rejected.
  anonymousGit:
    enabled: false
  scan:
    enabled: true
    command: trivy
    severity: HIGH,CRITICAL
  signing:
    enabled: true
    command: cosign
    existingSecret: ""
    keyKey: cosign.key
    passwordKey: cosign.password
  verification:
    # Local public-key Secret projection; must contain the same approved public
    # trust key as security.imageVerification.trustRoot. No private key here.
    # Empty reuses that trustRoot only when its namespace is the release namespace.
    existingSecret: ""
    key: cosign.pub
  nodeSelector:
    raibitserver.io/workload: build
  tolerations:
    - key: raibitserver.io/workload
      operator: Equal
      value: build
      effect: NoSchedule
provisioner:
  replicas: 1
  execute: false
  reconcileIntervalSeconds: 5
  healthIntervalSeconds: 300
  # Production packaging requires images only for dedicated-local engines in
  # files/resource-capabilities-v1.json. This is not release readiness evidence.
  # Unsupported minio/qdrant/nats may stay empty. SQLite is local-file only.
  providerImages:
    postgresql: ""
    mysql: ""
    mariadb: ""
    mongodb: ""
    redis: ""
    valkey: ""
    minio: ""
    qdrant: ""
    nats: ""
observability:
  logIngester:
    enabled: false
    replicas: 1
    dbMaxOpenConns: 5
    dbMaxIdleConns: 2
    dbConnMaxLifetime: "30m"
    pageSize: 100
    maxPods: 200
    maxContainers: 8
    maxLines: 1000
    maxLineBytes: 16384
    maxReadBytes: 1048576
    maxRecords: 10000
    maxBytes: 16777216
    maxDuration: "20s"
    interval: "15s"
    retention: "168h"
    resources:
      requests: { cpu: 50m, memory: 128Mi }
      limits: { cpu: 250m, memory: 256Mi }
  metricsIngester:
    enabled: false
    replicas: 1
    dbMaxOpenConns: 5
    dbMaxIdleConns: 2
    dbConnMaxLifetime: "30m"
    pageSize: 100
    maxPods: 500
    maxContainers: 8
    maxSamples: 10000
    maxDuration: "20s"
    interval: "30s"
    retention: "720h"
    resources:
      requests: { cpu: 50m, memory: 128Mi }
      limits: { cpu: 250m, memory: 256Mi }
  networkPolicy:
    kubernetesApiEgress:
      port: 443
      cidrs: []
      endpointPort: 6443
      endpointCidrs: []
    databaseEgress:
      port: 5432
      selectorPeers: []
      cidrs: []
ingress:
  enabled: true
  className: nginx
  # Reserved Kubernetes namespace identity used by tenant NetworkPolicies.
  # Workload/project input cannot override this platform-owned value.
  gatewayNamespace: ingress-nginx
  annotations: {}
  hosts:
    public: raibitserver.app
    api: api.raibitserver.app
    dashboard: console.raibitserver.app
  tls:
    enabled: false
    existingSecret: ""
migration:
  enabled: true
  activeDeadlineSeconds: 300
  backoffLimit: 2
  ttlSecondsAfterFinished: 300
  resources:
    requests: { cpu: 50m, memory: 128Mi }
    limits: { cpu: 500m, memory: 512Mi }
security:
  imageVerification:
    enabled: true
    provider: cosign
    admissionController:
      name: ""
      namespace: ""
      existingWebhookConfiguration: ""
      webhookName: ""
      deploymentName: ""
      serviceName: ""
      clientConfig:
        service:
          namespace: ""
          name: ""
          path: ""
        url:
          host: ""
          path: ""
    trustRoot:
      namespace: ""
      existingSecret: ""
      key: cosign.pub
    verificationHook:
      enabled: false
      activeDeadlineSeconds: 120
      checkerImage:
        repository: docker.io/alpine/k8s:1.34.1
        digest: ""
    policy:
      enabled: true
