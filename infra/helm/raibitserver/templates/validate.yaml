{{- range $name := list "enabled" "implementationAvailable" "releaseSourceClean" -}}
{{- if not (kindIs "bool" (index $.Values.operational $name)) -}}
{{- fail (printf "operational.%s must be a boolean" $name) -}}
{{- end -}}
{{- end -}}
{{- if .Values.operational.enabled -}}
{{- if not .Values.operational.implementationAvailable -}}
{{- fail "operational.enabled requires operational.implementationAvailable=true" -}}
{{- end -}}
{{- if ne (toString .Values.operational.protocolVersion) "2" -}}
{{- fail "operational.enabled requires operational.protocolVersion=2" -}}
{{- end -}}
{{- if not (regexMatch "^[a-f0-9]{64}$" (toString .Values.operational.contractDigest)) -}}
{{- fail "operational.enabled requires operational.contractDigest to be 64 lowercase hexadecimal characters" -}}
{{- end -}}
{{- if not (regexMatch "^[a-f0-9]{40}$" (toString .Values.operational.releaseRevision)) -}}
{{- fail "operational.enabled requires operational.releaseRevision to be a 40-character lowercase Git SHA" -}}
{{- end -}}
{{- if not .Values.operational.releaseSourceClean -}}
{{- fail "operational.enabled requires operational.releaseSourceClean=true" -}}
{{- end -}}
{{- end -}}
{{- if not (regexMatch "^[0-9]*[1-9][0-9]*$" (toString .Values.provisioner.healthIntervalSeconds)) -}}
{{- fail "provisioner.healthIntervalSeconds must be a positive integer" -}}
{{- end -}}
{{- if not (regexMatch "^[a-z0-9]([-a-z0-9]{0,61}[a-z0-9])?$" (default "" .Values.ingress.gatewayNamespace)) -}}
{{- fail "ingress.gatewayNamespace must be a Kubernetes DNS label" -}}
{{- end -}}
{{- if and .Values.hostedErrors.enabled (not .Values.dashboard.enabled) -}}
{{- fail "hostedErrors requires dashboard.enabled because the dashboard image serves the error backend" -}}
{{- end -}}
{{- if and .Values.hostedErrors.enabled (eq (len .Values.hostedErrors.statuses) 0) -}}
{{- fail "hostedErrors.statuses must include at least one infrastructure status" -}}
{{- end -}}
{{- if .Values.hostedErrors.enabled -}}
{{- range .Values.hostedErrors.statuses -}}
{{- if not (regexMatch "^(500|502|503|504)$" (toString .)) -}}
{{- fail "hostedErrors.statuses may contain only 500, 502, 503, and 504" -}}
{{- end -}}
{{- end -}}
{{- end -}}
{{- if .Values.production -}}
{{- if or (not .Values.database.existingSecret) (not .Values.database.urlKey) -}}
{{- fail "production database.existingSecret and database.urlKey are required" -}}
{{- end -}}
{{- if not .Values.runtimeSecrets.existingSecret -}}
{{- fail "production runtimeSecrets.existingSecret is required" -}}
{{- end -}}
{{- if not .Values.dashboard.enabled -}}
{{- fail "production dashboard must be enabled" -}}
{{- end -}}
{{- if not (regexMatch "^https://[A-Za-z0-9.-]+(:[0-9]+)?(/[^?#]*)?$" (default "" .Values.dashboard.consoleUrl)) -}}
{{- fail "production dashboard.consoleUrl must be an explicit HTTPS URL" -}}
{{- end -}}
{{- if not (regexMatch "^sha256:[a-f0-9]{64}$" (default "" .Values.image.digests.dashboard)) -}}
{{- fail "production platform image dashboard requires a valid sha256 digest" -}}
{{- end -}}
{{- if not .Values.ingress.enabled -}}
{{- fail "production ingress must be enabled" -}}
{{- end -}}
{{- if or (not .Values.ingress.hosts.public) (not .Values.ingress.hosts.api) (not .Values.ingress.hosts.dashboard) -}}
{{- fail "production ingress public, API, and dashboard hosts are required" -}}
{{- end -}}
{{- if eq .Values.ingress.hosts.public .Values.ingress.hosts.dashboard -}}
{{- fail "production ingress public and dashboard hosts must be distinct" -}}
{{- end -}}
{{- if ne .Values.ingress.hosts.dashboard (printf "console.%s" .Values.ingress.hosts.public) -}}
{{- fail "production ingress dashboard host must be console.<public-host>" -}}
{{- end -}}
{{- if ne .Values.dashboard.consoleUrl (printf "https://%s/console" .Values.ingress.hosts.dashboard) -}}
{{- fail "production dashboard.consoleUrl must match the dashboard ingress host and /console path" -}}
{{- end -}}
{{- if or (not .Values.ingress.tls.enabled) (not .Values.ingress.tls.existingSecret) -}}
{{- fail "production ingress TLS must be enabled with an existing secret" -}}
{{- end -}}
{{- if not .Values.migration.enabled -}}
{{- fail "production database migration hook must be enabled" -}}
{{- end -}}
{{- if not .Values.orchestrator.execute -}}
{{- fail "production orchestrator execution must be enabled" -}}
{{- end -}}
{{- if not .Values.provisioner.execute -}}
{{- fail "production provisioner execution must be enabled" -}}
{{- end -}}
{{- end -}}
