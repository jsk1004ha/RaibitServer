apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: {{ include "raibitserver.fullname" . }}-provisioner-provider-pvc-ownership
spec:
  policyName: {{ include "raibitserver.fullname" . }}-provisioner-provider-pvc-ownership
  validationActions: ["Deny"]
