apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: {{ include "raibitserver.fullname" . }}-provisioner-provider-statefulsets
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: ["apps"]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["statefulsets"]
  matchConditions:
    - name: provisioner-service-account
      expression: {{ printf "request.userInfo.username == 'system:serviceaccount:%s:%s-provisioner'" .Release.Namespace (include "raibitserver.fullname" .) | quote }}
  variables:
    - name: providerName
      expression: "object.metadata.labels['app.kubernetes.io/name']"
    - name: provider
      expression: "object.metadata.labels['raibitserver.io/provider']"
    - name: connectionSecret
      expression: "variables.providerName + '-connection'"
    - name: dataClaim
      expression: "variables.providerName + '-data'"
    - name: podSpec
      expression: "object.spec.template.spec"
    - name: container
      expression: "variables.podSpec.containers[0]"
    - name: expectedPort
      expression: >-
        variables.provider == 'postgresql' ? 5432 :
        variables.provider in ['mysql', 'mariadb'] ? 3306 :
        variables.provider == 'mongodb' ? 27017 :
        variables.provider in ['redis', 'valkey'] ? 6379 :
        variables.provider == 'object-storage' ? 9000 :
        variables.provider == 'qdrant' ? 6333 :
        variables.provider == 'nats' ? 4222 : 0
    - name: expectedRunAs
      expression: >-
        variables.provider == 'postgresql' ? 70 :
        variables.provider in ['mysql', 'mariadb', 'mongodb', 'redis', 'valkey'] ? 999 : 10001
    - name: expectedDataMount
      expression: >-
        variables.provider == 'postgresql' ? '/var/lib/postgresql/data' :
        variables.provider in ['mysql', 'mariadb'] ? '/var/lib/mysql' :
        variables.provider == 'mongodb' ? '/data/db' :
        variables.provider == 'qdrant' ? '/qdrant/storage' : '/data'
    - name: expectedEnvNames
      expression: >-
        variables.provider == 'postgresql' ? ['DATABASE_URL', 'PGDATABASE', 'PGHOST', 'PGPASSWORD', 'PGPORT', 'PGUSER', 'POSTGRES_DB', 'POSTGRES_PASSWORD', 'POSTGRES_URL', 'POSTGRES_USER'] :
        variables.provider == 'mysql' ? ['MYSQL_DATABASE', 'MYSQL_HOST', 'MYSQL_PASSWORD', 'MYSQL_PORT', 'MYSQL_PWD', 'MYSQL_ROOT_PASSWORD', 'MYSQL_URL', 'MYSQL_USER'] :
        variables.provider == 'mariadb' ? ['MARIADB_DATABASE', 'MARIADB_PASSWORD', 'MARIADB_ROOT_PASSWORD', 'MARIADB_URL', 'MARIADB_USER', 'MYSQL_DATABASE', 'MYSQL_HOST', 'MYSQL_PASSWORD', 'MYSQL_PORT', 'MYSQL_PWD', 'MYSQL_URL', 'MYSQL_USER'] :
        variables.provider == 'mongodb' ? ['MONGODB_URI', 'MONGO_DATABASE', 'MONGO_HOST', 'MONGO_INITDB_DATABASE', 'MONGO_INITDB_ROOT_PASSWORD', 'MONGO_INITDB_ROOT_USERNAME', 'MONGO_PASSWORD', 'MONGO_URL', 'MONGO_USER'] :
        variables.provider == 'redis' ? ['REDIS_HOST', 'REDIS_PASSWORD', 'REDIS_PORT', 'REDIS_URL', 'REDIS_USERNAME'] :
        variables.provider == 'valkey' ? ['REDIS_HOST', 'REDIS_PASSWORD', 'REDIS_PORT', 'REDIS_URL', 'REDIS_USERNAME', 'VALKEY_URL'] :
        variables.provider == 'object-storage' ? ['MINIO_ROOT_PASSWORD', 'MINIO_ROOT_USER', 'S3_ACCESS_KEY', 'S3_BUCKET', 'S3_ENDPOINT', 'S3_REGION', 'S3_SECRET_KEY'] :
        variables.provider == 'qdrant' ? ['QDRANT_URL', 'QDRANT__SERVICE__API_KEY', 'VECTOR_DB_API_KEY', 'VECTOR_DB_COLLECTION', 'VECTOR_DB_URL'] :
        variables.provider == 'nats' ? ['NATS_URL', 'QUEUE_PASSWORD', 'QUEUE_TOPIC', 'QUEUE_URL', 'QUEUE_USERNAME'] : []
    - name: expectedArgs
      expression: >-
        variables.provider in ['redis', 'valkey'] ? ['--requirepass', '$(REDIS_PASSWORD)'] :
        variables.provider == 'object-storage' ? ['server', '/data', '--console-address', ':9001'] :
        variables.provider == 'nats' ? ['-c', '/etc/nats/nats.conf'] : []
    - name: probeScript
      expression: "has(variables.container.readinessProbe.exec) && variables.container.readinessProbe.exec.command.size() == 3 ? variables.container.readinessProbe.exec.command[2] : ''"
  validations:
    - expression: >-
        has(object.metadata.labels) && object.metadata.labels.size() == 6 &&
        object.metadata.labels['app.kubernetes.io/managed-by'] == 'raibitserver' &&
        object.metadata.labels['raibitserver.io/managed'] == 'true' &&
        object.metadata.labels['app.kubernetes.io/name'].matches('^[a-z0-9]([a-z0-9-]*[a-z0-9])?$') &&
        object.metadata.labels['raibitserver.io/project-id'] != '' &&
        object.metadata.labels['raibitserver.io/resource-id'] != '' &&
        variables.provider in {{ include "raibitserver.localProviderEngines" . }}
      message: "provider StatefulSets require the exact managed identity label contract"
    - expression: >-
        object.metadata.name == variables.providerName && object.metadata.namespace == request.namespace &&
        object.spec.serviceName == variables.providerName && object.spec.replicas == 1 &&
        object.spec.selector.matchLabels.size() == 1 && object.spec.selector.matchLabels['app.kubernetes.io/name'] == variables.providerName &&
        (!has(object.spec.selector.matchExpressions) || object.spec.selector.matchExpressions.size() == 0) &&
        object.spec.template.metadata.labels == object.metadata.labels
      message: "provider StatefulSet names and selectors must match their managed identity"
    - expression: >-
        has(object.spec.template.metadata.annotations) && object.spec.template.metadata.annotations.size() == 2 &&
        object.spec.template.metadata.annotations['raibitserver.io/verify-image-signatures'] == 'required' &&
        object.spec.template.metadata.annotations['raibitserver.io/reconcile-token'].matches('^[A-Za-z0-9_-]{24}$')
      message: "provider pods require only the reconciliation and signature-verification annotations"
    - expression: >-
        variables.podSpec.automountServiceAccountToken == false &&
        (!has(variables.podSpec.serviceAccountName) || variables.podSpec.serviceAccountName == 'default') &&
        (!has(variables.podSpec.hostNetwork) || variables.podSpec.hostNetwork == false) &&
        (!has(variables.podSpec.hostPID) || variables.podSpec.hostPID == false) &&
        (!has(variables.podSpec.hostIPC) || variables.podSpec.hostIPC == false) &&
        (!has(variables.podSpec.shareProcessNamespace) || variables.podSpec.shareProcessNamespace == false) &&
        (!has(variables.podSpec.initContainers) || variables.podSpec.initContainers.size() == 0) &&
        (!has(variables.podSpec.ephemeralContainers) || variables.podSpec.ephemeralContainers.size() == 0) &&
        (!has(variables.podSpec.hostAliases) || variables.podSpec.hostAliases.size() == 0) && !has(variables.podSpec.dnsConfig)
      message: "provider pods may not inherit service-account credentials or host execution surfaces"
    - expression: >-
        variables.podSpec.securityContext.runAsNonRoot == true &&
        variables.podSpec.securityContext.runAsUser == variables.expectedRunAs &&
        variables.podSpec.securityContext.runAsGroup == variables.expectedRunAs &&
        variables.podSpec.securityContext.fsGroup == variables.expectedRunAs &&
        variables.podSpec.securityContext.seccompProfile.type == 'RuntimeDefault' &&
        variables.podSpec.containers.size() == 1
      message: "provider pods require the compiler-defined restricted pod security context"
    - expression: >-
        variables.container.name == variables.providerName &&
        variables.container.image.matches('^[A-Za-z0-9][A-Za-z0-9._:/-]*@sha256:[a-f0-9]{64}$') &&
        variables.container.imagePullPolicy == 'IfNotPresent' &&
        variables.container.securityContext.allowPrivilegeEscalation == false &&
        variables.container.securityContext.runAsNonRoot == true &&
        variables.container.securityContext.runAsUser == variables.expectedRunAs &&
        variables.container.securityContext.runAsGroup == variables.expectedRunAs &&
        (!has(variables.container.securityContext.privileged) || variables.container.securityContext.privileged == false) &&
        (!has(variables.container.securityContext.procMount) || variables.container.securityContext.procMount == 'Default') &&
        variables.container.securityContext.capabilities.drop.size() == 1 && 'ALL' in variables.container.securityContext.capabilities.drop &&
        (!has(variables.container.securityContext.capabilities.add) || variables.container.securityContext.capabilities.add.size() == 0)
      message: "provider containers require digest pins and a restricted security context"
    - expression: >-
        !has(variables.container.command) && !has(variables.container.lifecycle) &&
        (!has(variables.container.stdin) || variables.container.stdin == false) &&
        (!has(variables.container.tty) || variables.container.tty == false) &&
        (variables.expectedArgs.size() == 0 ? (!has(variables.container.args) || variables.container.args.size() == 0) : variables.container.args == variables.expectedArgs)
      message: "provider commands and arguments must match the finite engine contract"
    - expression: >-
        !has(variables.container.envFrom) &&
        variables.container.env.size() == variables.expectedEnvNames.size() + (variables.provider == 'postgresql' ? 1 : 0) &&
        variables.expectedEnvNames.all(name, variables.container.env.filter(env, env.name == name).size() == 1) &&
        variables.container.env.filter(env, env.name == 'PGDATA').size() == (variables.provider == 'postgresql' ? 1 : 0) &&
        variables.container.env.all(env,
        (variables.provider == 'postgresql' && env.name == 'PGDATA' &&
        has(env.value) && env.value == '/var/lib/postgresql/data/pgdata' && !has(env.valueFrom)) ||
        (env.name in variables.expectedEnvNames && !has(env.value) && has(env.valueFrom) && has(env.valueFrom.secretKeyRef) &&
        !has(env.valueFrom.configMapKeyRef) && !has(env.valueFrom.fieldRef) && !has(env.valueFrom.resourceFieldRef) &&
        env.valueFrom.secretKeyRef.name == variables.connectionSecret && env.valueFrom.secretKeyRef.key == env.name &&
        (!has(env.valueFrom.secretKeyRef.optional) || env.valueFrom.secretKeyRef.optional == false)))
      message: "provider environment variables may only use exact Secret refs plus the PostgreSQL PGDATA literal"
    - expression: >-
        has(variables.container.resources) && has(variables.container.resources.requests) && has(variables.container.resources.limits) &&
        variables.container.resources.requests.size() == 3 && variables.container.resources.requests['cpu'] == '100m' && variables.container.resources.requests['memory'] == '128Mi' && variables.container.resources.requests['ephemeral-storage'] == '256Mi' &&
        variables.container.resources.limits.size() == 3 && variables.container.resources.limits['cpu'] == '1' && variables.container.resources.limits['memory'] == '1Gi' && variables.container.resources.limits['ephemeral-storage'] == '1Gi' &&
        (!has(variables.container.resources.claims) || variables.container.resources.claims.size() == 0)
      message: "provider containers require the compiler-defined resource requests and limits"
    - expression: >-
        variables.container.ports.size() == (variables.provider == 'object-storage' ? 2 : 1) &&
        variables.container.ports.all(port, (!has(port.protocol) || port.protocol == 'TCP') && !has(port.hostIP) && (!has(port.hostPort) || port.hostPort == 0)) &&
        variables.container.ports.filter(port, port.name == 'provider' && port.containerPort == variables.expectedPort).size() == 1 &&
        (variables.provider == 'object-storage' ? variables.container.ports.filter(port, port.name == 'console' && port.containerPort == 9001).size() == 1 : variables.container.ports.filter(port, port.name != 'provider').size() == 0)
      message: "provider containers may expose only their engine ports"
    - expression: >-
        variables.podSpec.volumes.size() == (variables.provider == 'nats' ? 2 : 1) &&
        variables.podSpec.volumes.filter(volume, volume.name == 'data' && has(volume.persistentVolumeClaim) && volume.persistentVolumeClaim.claimName == variables.dataClaim && (!has(volume.persistentVolumeClaim.readOnly) || volume.persistentVolumeClaim.readOnly == false)).size() == 1 &&
        variables.podSpec.volumes.all(volume, volume.name == 'data' || (variables.provider == 'nats' && volume.name == 'provider-config' && has(volume.secret) && volume.secret.secretName == variables.connectionSecret && volume.secret.items.size() == 1 && volume.secret.items[0].key == 'nats.conf' && volume.secret.items[0].path == 'nats.conf')) &&
        variables.container.volumeMounts.size() == (variables.provider == 'nats' ? 2 : 1) &&
        variables.container.volumeMounts.filter(mount, mount.name == 'data' && mount.mountPath == variables.expectedDataMount && (!has(mount.readOnly) || mount.readOnly == false) && !has(mount.subPath) && !has(mount.subPathExpr)).size() == 1 &&
        variables.container.volumeMounts.all(mount, mount.name == 'data' || (variables.provider == 'nats' && mount.name == 'provider-config' && mount.mountPath == '/etc/nats' && mount.readOnly == true && !has(mount.subPath) && !has(mount.subPathExpr)))
      message: "provider volumes may only mount their matching data PVC and NATS connection configuration"
    - expression: >-
        has(variables.container.livenessProbe.tcpSocket) && variables.container.livenessProbe.tcpSocket.port == 'provider' &&
        !has(variables.container.livenessProbe.exec) && !has(variables.container.livenessProbe.httpGet) && !has(variables.container.livenessProbe.grpc) &&
        variables.container.livenessProbe.initialDelaySeconds == 30 && variables.container.livenessProbe.periodSeconds == 10 &&
        variables.container.livenessProbe.timeoutSeconds == 2 && variables.container.livenessProbe.failureThreshold == 6
      message: "provider liveness probes must use the fixed local TCP contract"
    - expression: >-
        (variables.provider in ['object-storage', 'qdrant', 'nats'] &&
        has(variables.container.readinessProbe.tcpSocket) && variables.container.readinessProbe.tcpSocket.port == 'provider' &&
        !has(variables.container.readinessProbe.exec) && !has(variables.container.readinessProbe.httpGet) && !has(variables.container.readinessProbe.grpc) &&
        variables.container.readinessProbe.initialDelaySeconds == 5 && variables.container.readinessProbe.periodSeconds == 5 &&
        variables.container.readinessProbe.timeoutSeconds == 2 && variables.container.readinessProbe.failureThreshold == 12) ||
        (variables.provider in ['postgresql', 'mysql', 'mariadb', 'mongodb', 'redis', 'valkey'] &&
        has(variables.container.readinessProbe.exec) && variables.container.readinessProbe.exec.command.size() == 3 &&
        variables.container.readinessProbe.exec.command[0] == '/bin/sh' && variables.container.readinessProbe.exec.command[1] == '-ec' &&
        !has(variables.container.readinessProbe.tcpSocket) && !has(variables.container.readinessProbe.httpGet) && !has(variables.container.readinessProbe.grpc) &&
        variables.container.readinessProbe.initialDelaySeconds == 5 && variables.container.readinessProbe.periodSeconds == 5 &&
        variables.container.readinessProbe.timeoutSeconds == 5 && variables.container.readinessProbe.failureThreshold == 12)
      message: "provider readiness probes must use the compiler-defined engine probe shape"
    - expression: >-
        (variables.provider in ['object-storage', 'qdrant', 'nats'] &&
        has(variables.container.startupProbe.tcpSocket) && variables.container.startupProbe.tcpSocket.port == 'provider' &&
        !has(variables.container.startupProbe.exec) && !has(variables.container.startupProbe.httpGet) && !has(variables.container.startupProbe.grpc) &&
        variables.container.startupProbe.periodSeconds == 10 && variables.container.startupProbe.timeoutSeconds == 5 && variables.container.startupProbe.failureThreshold == 120) ||
        (variables.provider in ['postgresql', 'mysql', 'mariadb', 'mongodb', 'redis', 'valkey'] &&
        has(variables.container.startupProbe.exec) && variables.container.startupProbe.exec.command == variables.container.readinessProbe.exec.command &&
        !has(variables.container.startupProbe.tcpSocket) && !has(variables.container.startupProbe.httpGet) && !has(variables.container.startupProbe.grpc) &&
        variables.container.startupProbe.periodSeconds == 10 && variables.container.startupProbe.timeoutSeconds == 5 && variables.container.startupProbe.failureThreshold == 120)
      message: "provider startup probes must use the compiler-defined engine probe with a bounded initialization window"
    - expression: >-
        variables.provider in ['object-storage', 'qdrant', 'nats'] ||
        (!variables.probeScript.contains('\n') && !variables.probeScript.contains('\r') && !variables.probeScript.contains('`') &&
        ((variables.provider == 'postgresql' && variables.probeScript.matches('^test "\\$PGHOST" = "[a-z0-9-]+\\.[a-z0-9-]+\\.svc\\.cluster\\.local" && test "\\$PGPORT" = "5432" && test "\\$PGDATABASE" = "[a-z][a-z0-9_]{0,31}" && test "\\$PGUSER" = "[a-z][a-z0-9_]{0,31}" && test "\\$POSTGRES_DB" = "\\$PGDATABASE" && test "\\$POSTGRES_USER" = "\\$PGUSER" && test "\\$POSTGRES_PASSWORD" = "\\$PGPASSWORD" && test "\\$DATABASE_URL" = "postgresql://\\$PGUSER:\\$PGPASSWORD@\\$PGHOST:\\$PGPORT/\\$PGDATABASE" && test "\\$POSTGRES_URL" = "\\$DATABASE_URL" && exec psql --no-psqlrc --host=127\\.0\\.0\\.1 --port="\\$PGPORT" --username="\\$PGUSER" --dbname="\\$PGDATABASE" --set=ON_ERROR_STOP=1 --command=\'SELECT 1\' >/dev/null$')) ||
        (variables.provider == 'mysql' && variables.probeScript.matches('^test "\\$MYSQL_HOST" = "[a-z0-9-]+\\.[a-z0-9-]+\\.svc\\.cluster\\.local" && test "\\$MYSQL_PORT" = "3306" && test "\\$MYSQL_DATABASE" = "[a-z][a-z0-9_]{0,31}" && test "\\$MYSQL_USER" = "[a-z][a-z0-9_]{0,31}" && test "\\$MYSQL_PWD" = "\\$MYSQL_PASSWORD" && test "\\$MYSQL_URL" = "mysql://\\$MYSQL_USER:\\$MYSQL_PASSWORD@\\$MYSQL_HOST:\\$MYSQL_PORT/\\$MYSQL_DATABASE" && exec mysql --protocol=TCP --host=127\\.0\\.0\\.1 --port="\\$MYSQL_PORT" --user="\\$MYSQL_USER" "\\$MYSQL_DATABASE" --execute=\'SELECT 1\' >/dev/null$')) ||
        (variables.provider == 'mariadb' && variables.probeScript.matches('^test "\\$MYSQL_HOST" = "[a-z0-9-]+\\.[a-z0-9-]+\\.svc\\.cluster\\.local" && test "\\$MYSQL_PORT" = "3306" && test "\\$MYSQL_DATABASE" = "[a-z][a-z0-9_]{0,31}" && test "\\$MYSQL_USER" = "[a-z][a-z0-9_]{0,31}" && test "\\$MYSQL_PWD" = "\\$MYSQL_PASSWORD" && test "\\$MARIADB_DATABASE" = "\\$MYSQL_DATABASE" && test "\\$MARIADB_USER" = "\\$MYSQL_USER" && test "\\$MARIADB_PASSWORD" = "\\$MYSQL_PASSWORD" && test "\\$MYSQL_URL" = "mysql://\\$MYSQL_USER:\\$MYSQL_PASSWORD@\\$MYSQL_HOST:\\$MYSQL_PORT/\\$MYSQL_DATABASE" && test "\\$MARIADB_URL" = "\\$MYSQL_URL" && exec mariadb --protocol=TCP --host=127\\.0\\.0\\.1 --port="\\$MYSQL_PORT" --user="\\$MYSQL_USER" "\\$MYSQL_DATABASE" --execute=\'SELECT 1\' >/dev/null$')) ||
        (variables.provider == 'mongodb' && variables.probeScript.matches('^test "\\$MONGO_HOST" = "[a-z0-9-]+\\.[a-z0-9-]+\\.svc\\.cluster\\.local" && test "\\$MONGO_DATABASE" = "[a-z][a-z0-9_]{0,31}" && test "\\$MONGO_USER" = "[a-z][a-z0-9_]{0,31}" && test "\\$MONGO_INITDB_DATABASE" = "\\$MONGO_DATABASE" && test "\\$MONGO_INITDB_ROOT_USERNAME" = "\\$MONGO_USER" && test "\\$MONGO_INITDB_ROOT_PASSWORD" = "\\$MONGO_PASSWORD" && test "\\$MONGODB_URI" = "mongodb://\\$MONGO_USER:\\$MONGO_PASSWORD@\\$MONGO_HOST:27017/\\$MONGO_DATABASE\\?authSource=admin" && test "\\$MONGO_URL" = "\\$MONGODB_URI" && exec mongosh --quiet "mongodb://\\$MONGO_USER:\\$MONGO_PASSWORD@127\\.0\\.0\\.1:27017/\\$MONGO_DATABASE\\?authSource=admin" --eval \'quit\\(db\\.runCommand\\(\\{ ping: 1 \\}\\)\\.ok === 1 \\? 0 : 1\\)\' >/dev/null$')) ||
        (variables.provider == 'redis' && variables.probeScript.matches('^test "\\$REDIS_HOST" = "[a-z0-9-]+\\.[a-z0-9-]+\\.svc\\.cluster\\.local" && test "\\$REDIS_PORT" = "6379" && test "\\$REDIS_USERNAME" = "default" && test "\\$REDIS_URL" = "redis://:\\$REDIS_PASSWORD@\\$REDIS_HOST:\\$REDIS_PORT/0"; unset REDISCLI_AUTH VALKEYCLI_AUTH; test "\\$\\(redis-cli -h 127\\.0\\.0\\.1 -p "\\$REDIS_PORT" --raw AUTH "\\$REDIS_PASSWORD"\\)" = "OK"; export REDISCLI_AUTH="\\$REDIS_PASSWORD" VALKEYCLI_AUTH="\\$REDIS_PASSWORD"; test "\\$\\(redis-cli -h 127\\.0\\.0\\.1 -p "\\$REDIS_PORT" --raw PING\\)" = PONG$')) ||
        (variables.provider == 'valkey' && variables.probeScript.matches('^test "\\$REDIS_HOST" = "[a-z0-9-]+\\.[a-z0-9-]+\\.svc\\.cluster\\.local" && test "\\$REDIS_PORT" = "6379" && test "\\$REDIS_USERNAME" = "default" && test "\\$REDIS_URL" = "redis://:\\$REDIS_PASSWORD@\\$REDIS_HOST:\\$REDIS_PORT/0" && test "\\$VALKEY_URL" = "\\$REDIS_URL"; unset REDISCLI_AUTH VALKEYCLI_AUTH; test "\\$\\(valkey-cli -h 127\\.0\\.0\\.1 -p "\\$REDIS_PORT" --raw AUTH "\\$REDIS_PASSWORD"\\)" = "OK"; export REDISCLI_AUTH="\\$REDIS_PASSWORD" VALKEYCLI_AUTH="\\$REDIS_PASSWORD"; test "\\$\\(valkey-cli -h 127\\.0\\.0\\.1 -p "\\$REDIS_PORT" --raw PING\\)" = PONG$'))))
      message: "provider exec readiness probes must match a finite engine-specific authentication script"
