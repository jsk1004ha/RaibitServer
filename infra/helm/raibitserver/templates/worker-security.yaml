apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: {{ include "raibitserver.fullname" . }}-provisioner-provider-statefulsets
spec:
  policyName: {{ include "raibitserver.fullname" . }}-provisioner-provider-statefulsets
  validationActions: ["Deny"]
