        object.spec.accessModes == oldObject.spec.accessModes && object.spec.resources == oldObject.spec.resources &&
        ((!has(object.spec.selector) && !has(oldObject.spec.selector)) || (has(object.spec.selector) && has(oldObject.spec.selector) && object.spec.selector == oldObject.spec.selector)) &&
        ((!has(object.spec.storageClassName) && !has(oldObject.spec.storageClassName)) || (has(object.spec.storageClassName) && has(oldObject.spec.storageClassName) && object.spec.storageClassName == oldObject.spec.storageClassName)) &&
        ((!has(object.spec.volumeMode) && !has(oldObject.spec.volumeMode)) || (has(object.spec.volumeMode) && has(oldObject.spec.volumeMode) && object.spec.volumeMode == oldObject.spec.volumeMode)) &&
        ((!has(object.spec.dataSource) && !has(oldObject.spec.dataSource)) || (has(object.spec.dataSource) && has(oldObject.spec.dataSource) && object.spec.dataSource == oldObject.spec.dataSource)) &&
        ((!has(object.spec.dataSourceRef) && !has(oldObject.spec.dataSourceRef)) || (has(object.spec.dataSourceRef) && has(oldObject.spec.dataSourceRef) && object.spec.dataSourceRef == oldObject.spec.dataSourceRef)) &&
        ((!has(object.spec.volumeAttributesClassName) && !has(oldObject.spec.volumeAttributesClassName)) || (has(object.spec.volumeAttributesClassName) && has(oldObject.spec.volumeAttributesClassName) && object.spec.volumeAttributesClassName == oldObject.spec.volumeAttributesClassName)) &&
        ((!has(oldObject.spec.volumeName) || oldObject.spec.volumeName == '') ? (!has(object.spec.volumeName) || object.spec.volumeName.matches('^[a-z0-9]([a-z0-9.-]*[a-z0-9])?$')) : object.spec.volumeName == oldObject.spec.volumeName) &&
        (!has(object.metadata.annotations) || object.metadata.annotations.all(key,
        key in variables.controllerAnnotationKeys || (has(oldObject.metadata.annotations) && key in oldObject.metadata.annotations && object.metadata.annotations[key] == oldObject.metadata.annotations[key]))) &&
        (!has(oldObject.metadata.annotations) || oldObject.metadata.annotations.all(key,
        key in variables.controllerAnnotationKeys || (has(object.metadata.annotations) && key in object.metadata.annotations && object.metadata.annotations[key] == oldObject.metadata.annotations[key]))))
      message: "storage controllers may update only binding fields and controller-owned metadata"
