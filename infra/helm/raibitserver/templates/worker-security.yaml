{{- $databaseEgress := .Values.builder.databaseEgress -}}
{{- $githubApp := .Values.builder.githubAppCredentials -}}
{{- $ingressClassName := .Values.ingress.className | trim -}}
{{- $ingressAnnotationCount := 1 -}}
{{- if .Values.hostedErrors.enabled -}}
{{- $ingressAnnotationCount = add $ingressAnnotationCount 1 -}}
{{- end -}}
{{- if and .Values.hostedErrors.enabled .Values.hostedErrors.traefik.enabled -}}
{{- $ingressAnnotationCount = add $ingressAnnotationCount 1 -}}
{{- end -}}
{{- if or (empty $ingressClassName) (gt (len $ingressClassName) 253) (not (regexMatch "^[a-z0-9]([-a-z0-9]{0,61}[a-z0-9])?(\\.[a-z0-9]([-a-z0-9]{0,61}[a-z0-9])?)*$" $ingressClassName)) -}}
{{- fail "ingress className must be a Kubernetes DNS subdomain" -}}
{{- end -}}
{{- if .Values.production -}}
{{- if or (lt (int $databaseEgress.port) 1) (gt (int $databaseEgress.port) 65535) -}}
{{- fail "production builder database egress port must be between 1 and 65535" -}}
{{- end -}}
{{- if and (empty $databaseEgress.selectorPeers) (empty $databaseEgress.cidrs) -}}
{{- fail "production builder database egress requires at least one namespace/pod selector peer or CIDR" -}}
{{- end -}}
{{- range $peer := $databaseEgress.selectorPeers -}}
{{- if and (empty $peer.namespaceSelector) (empty $peer.podSelector) -}}
{{- fail "production builder database egress selector peers require a namespaceSelector or podSelector" -}}
{{- end -}}
{{- end -}}
{{- range $cidr := $databaseEgress.cidrs -}}
{{- if empty $cidr -}}
{{- fail "production builder database egress CIDRs must be non-empty" -}}
{{- end -}}
{{- end -}}
{{- end -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "raibitserver.fullname" . }}-builder-dispatcher
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "raibitserver.fullname" . }}-builder-executor
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "raibitserver.fullname" . }}-orchestrator
automountServiceAccountToken: true
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "raibitserver.fullname" . }}-provisioner
automountServiceAccountToken: true
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "raibitserver.fullname" . }}-orchestrator
rules:
  - apiGroups: [""]
    resources: ["namespaces", "services"]
    verbs: ["get", "list", "watch", "create", "patch", "update", "delete"]
  - apiGroups: [""]
    resources: ["resourcequotas"]
    verbs: ["get", "list", "watch", "create", "patch", "update"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "watch", "create", "patch", "update", "delete"]
  - apiGroups: ["batch"]
    resources: ["jobs", "cronjobs"]
    verbs: ["get", "list", "watch", "create", "patch", "update", "delete"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["ingresses", "networkpolicies"]
    verbs: ["get", "list", "watch", "create", "patch", "update", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "raibitserver.fullname" . }}-orchestrator
roleRef: { apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: {{ include "raibitserver.fullname" . }}-orchestrator }
subjects:
  - { kind: ServiceAccount, name: {{ include "raibitserver.fullname" . }}-orchestrator, namespace: {{ .Release.Namespace }} }
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: {{ include "raibitserver.fullname" . }}-orchestrator-namespace-boundary
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE", "DELETE"]
        resources: ["namespaces"]
  matchConditions:
    - name: orchestrator-service-account
      expression: {{ printf "request.userInfo.username == 'system:serviceaccount:%s:%s-orchestrator'" .Release.Namespace (include "raibitserver.fullname" .) | quote }}
  variables:
    - name: target
      expression: "request.operation == 'DELETE' ? oldObject : object"
  validations:
    - expression: >-
        has(variables.target.metadata.labels) &&
        variables.target.metadata.labels.all(key, key in [
          'kubernetes.io/metadata.name', 'app.kubernetes.io/managed-by', 'raibitserver.io/managed',
          'raibitserver.io/namespace-kind', 'raibitserver.io/project', 'raibitserver.io/project-id',
          'pod-security.kubernetes.io/enforce', 'pod-security.kubernetes.io/audit', 'pod-security.kubernetes.io/warn']) &&
        variables.target.metadata.labels['app.kubernetes.io/managed-by'] == 'raibitserver' &&
        variables.target.metadata.labels['raibitserver.io/managed'] == 'true' &&
        variables.target.metadata.labels['raibitserver.io/namespace-kind'] == 'application' &&
        variables.target.metadata.labels['raibitserver.io/project-id'] != ''
      message: "the orchestrator may mutate only compiler-owned application namespaces"
    - expression: >-
        variables.target.metadata.labels['pod-security.kubernetes.io/enforce'] == 'restricted' &&
        variables.target.metadata.labels['pod-security.kubernetes.io/audit'] == 'restricted' &&
        variables.target.metadata.labels['pod-security.kubernetes.io/warn'] == 'restricted'
      message: "application namespaces must retain the restricted Pod Security boundary"
    - expression: >-
        request.operation == 'CREATE' ||
        (has(oldObject.metadata.labels) &&
        oldObject.metadata.labels['app.kubernetes.io/managed-by'] == 'raibitserver' &&
        oldObject.metadata.labels['raibitserver.io/managed'] == 'true' &&
        (!('raibitserver.io/namespace-kind' in oldObject.metadata.labels) ||
        oldObject.metadata.labels['raibitserver.io/namespace-kind'] == 'application'))
      message: "the orchestrator may not adopt or delete an unmanaged namespace"
    - expression: >-
        request.operation != 'UPDATE' ||
        (object.spec == oldObject.spec &&
        ['app.kubernetes.io/managed-by', 'raibitserver.io/managed', 'raibitserver.io/project-id',
         'pod-security.kubernetes.io/enforce', 'pod-security.kubernetes.io/audit', 'pod-security.kubernetes.io/warn'].all(key,
          key in oldObject.metadata.labels && object.metadata.labels[key] == oldObject.metadata.labels[key]) &&
        (!('raibitserver.io/namespace-kind' in oldObject.metadata.labels) ||
        object.metadata.labels['raibitserver.io/namespace-kind'] == oldObject.metadata.labels['raibitserver.io/namespace-kind']))
      message: "application namespace identity and security labels are immutable"
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: {{ include "raibitserver.fullname" . }}-orchestrator-namespace-boundary
spec:
  policyName: {{ include "raibitserver.fullname" . }}-orchestrator-namespace-boundary
  validationActions: ["Deny"]
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: {{ include "raibitserver.fullname" . }}-orchestrator-resourcequota-boundary
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["resourcequotas"]
  matchConditions:
    - name: orchestrator-service-account
      expression: {{ printf "request.userInfo.username == 'system:serviceaccount:%s:%s-orchestrator'" .Release.Namespace (include "raibitserver.fullname" .) | quote }}
  variables:
    - name: target
      expression: "object"
    - name: expectedHard
      expression: >-
        {'resourcequotas': quantity('1'),
         'pods': quantity('100'),
         'count/pods': quantity('200'),
         'count/deployments.apps': quantity('50'),
         'count/replicasets.apps': quantity('200'),
         'count/statefulsets.apps': quantity('50'),
         'count/jobs.batch': quantity('100'),
         'count/cronjobs.batch': quantity('50'),
         'services': quantity('100'),
         'persistentvolumeclaims': quantity('50'),
         'secrets': quantity('200'),
         'configmaps': quantity('100'),
         'count/ingresses.networking.k8s.io': quantity('100'),
         'count/networkpolicies.networking.k8s.io': quantity('200'),
         'requests.cpu': quantity('50'),
         'requests.memory': quantity('100Gi'),
         'requests.ephemeral-storage': quantity('100Gi'),
         'limits.cpu': quantity('100'),
         'limits.memory': quantity('200Gi'),
         'limits.ephemeral-storage': quantity('200Gi'),
         'requests.storage': quantity('1Ti')}
  validations:
    - expression: >-
        has(namespaceObject.metadata.labels) &&
        namespaceObject.metadata.labels['app.kubernetes.io/managed-by'] == 'raibitserver' &&
        namespaceObject.metadata.labels['raibitserver.io/managed'] == 'true' &&
        namespaceObject.metadata.labels['raibitserver.io/namespace-kind'] == 'application' &&
        namespaceObject.metadata.labels['pod-security.kubernetes.io/enforce'] == 'restricted'
      message: "the orchestrator may place tenant quotas only inside application namespaces"
    - expression: >-
        variables.target.metadata.name == 'tenant-resource-budget' &&
        has(variables.target.metadata.labels) && variables.target.metadata.labels.size() == 6 &&
        variables.target.metadata.labels.all(key, key in [
          'app.kubernetes.io/managed-by', 'raibitserver.io/managed', 'raibitserver.io/namespace-kind',
          'raibitserver.io/project', 'raibitserver.io/project-id', 'raibitserver.io/resource-kind']) &&
        variables.target.metadata.labels['app.kubernetes.io/managed-by'] == 'raibitserver' &&
        variables.target.metadata.labels['raibitserver.io/managed'] == 'true' &&
        variables.target.metadata.labels['raibitserver.io/namespace-kind'] == 'application' &&
        variables.target.metadata.labels['raibitserver.io/resource-kind'] == 'tenant-resource-quota' &&
        variables.target.metadata.labels['raibitserver.io/project-id'] != '' &&
        variables.target.metadata.labels['raibitserver.io/project-id'] == namespaceObject.metadata.labels['raibitserver.io/project-id']
      message: "tenant ResourceQuota requires the exact compiler-owned project identity"
    - expression: >-
        request.operation != 'UPDATE' ||
        (oldObject.metadata.name == object.metadata.name && has(oldObject.metadata.labels) &&
        oldObject.metadata.labels == object.metadata.labels)
      message: "tenant ResourceQuota ownership is immutable and unmanaged quotas may not be adopted"
    - expression: >-
        has(variables.target.spec.hard) && variables.target.spec.hard.size() == 21 &&
        variables.expectedHard.size() == 21 &&
        variables.expectedHard.all(key, key in variables.target.spec.hard &&
          quantity(variables.target.spec.hard[key]).compareTo(variables.expectedHard[key]) == 0)
      message: "tenant ResourceQuota must retain the complete compiler-owned hard budget"
    - expression: >-
        !has(variables.target.spec.scopes) && !has(variables.target.spec.scopeSelector)
      message: "tenant ResourceQuota must cover the complete namespace without scope bypasses"
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: {{ include "raibitserver.fullname" . }}-orchestrator-resourcequota-boundary
spec:
  policyName: {{ include "raibitserver.fullname" . }}-orchestrator-resourcequota-boundary
  validationActions: ["Deny"]
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: {{ include "raibitserver.fullname" . }}-orchestrator-workload-boundary
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: ["", "apps", "batch", "networking.k8s.io"]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE", "DELETE"]
        resources: ["deployments", "jobs", "cronjobs", "services", "ingresses", "networkpolicies"]
  matchConditions:
    - name: orchestrator-service-account
      expression: {{ printf "request.userInfo.username == 'system:serviceaccount:%s:%s-orchestrator'" .Release.Namespace (include "raibitserver.fullname" .) | quote }}
  variables:
    - name: target
      expression: "request.operation == 'DELETE' ? oldObject : object"
    - name: appName
      expression: "variables.target.metadata.labels['app.kubernetes.io/name']"
    - name: isPodWorkload
      expression: "variables.target.kind in ['Deployment', 'Job', 'CronJob']"
    - name: podTemplate
      expression: >-
        variables.target.kind == 'Deployment' ? variables.target.spec.template :
        variables.target.kind == 'Job' ? variables.target.spec.template :
        variables.target.kind == 'CronJob' ? variables.target.spec.jobTemplate.spec.template : variables.target
    - name: podSpec
      expression: "variables.isPodWorkload ? variables.podTemplate.spec : variables.target"
    - name: container
      expression: "variables.isPodWorkload && has(variables.podSpec.containers) && variables.podSpec.containers.size() == 1 ? variables.podSpec.containers[0] : variables.target"
    - name: ingressHost
      expression: "variables.target.kind == 'Ingress' && has(variables.target.metadata.annotations) && 'raibitserver.io/hostname' in variables.target.metadata.annotations ? variables.target.metadata.annotations['raibitserver.io/hostname'] : ''"
    - name: isPreviewRoute
      expression: "variables.target.kind == 'Ingress' && has(variables.target.metadata.labels) && 'raibitserver.io/preview-route' in variables.target.metadata.labels && variables.target.metadata.labels['raibitserver.io/preview-route'] == 'true'"
    - name: previewBackendService
      expression: "variables.isPreviewRoute ? variables.target.metadata.labels['raibitserver.io/preview-backend-service'] : ''"
  validations:
    - expression: >-
        has(namespaceObject.metadata.labels) &&
        namespaceObject.metadata.labels['app.kubernetes.io/managed-by'] == 'raibitserver' &&
        namespaceObject.metadata.labels['raibitserver.io/managed'] == 'true' &&
        namespaceObject.metadata.labels['raibitserver.io/namespace-kind'] == 'application' &&
        namespaceObject.metadata.labels['pod-security.kubernetes.io/enforce'] == 'restricted'
      message: "the orchestrator may mutate namespaced objects only inside application tenant namespaces"
    - expression: >-
        has(variables.target.metadata.labels) &&
        variables.target.metadata.labels['app.kubernetes.io/managed-by'] == 'raibitserver' &&
        variables.target.metadata.labels['raibitserver.io/managed'] == 'true' &&
        variables.target.metadata.labels['raibitserver.io/project-id'] != '' &&
        variables.target.metadata.labels['raibitserver.io/service-id'] != '' &&
        variables.target.metadata.labels['raibitserver.io/deployment-id'] != '' &&
        variables.target.metadata.labels['raibitserver.io/project-id'] == namespaceObject.metadata.labels['raibitserver.io/project-id']
      message: "orchestrator objects require the compiler-owned deployment identity labels"
    - expression: >-
        request.operation != 'UPDATE' ||
        (has(oldObject.metadata.labels) &&
        ['app.kubernetes.io/managed-by', 'raibitserver.io/managed', 'raibitserver.io/project-id', 'raibitserver.io/service-id'].all(key,
          key in oldObject.metadata.labels && object.metadata.labels[key] == oldObject.metadata.labels[key]))
      message: "orchestrator workload ownership labels are immutable"
    - expression: >-
        !has(variables.target.metadata.labels) || !('raibitserver.io/preview-route' in variables.target.metadata.labels) ||
        (variables.target.kind == 'Ingress' && variables.target.metadata.labels['raibitserver.io/preview-route'] == 'true')
      message: "the preview-route marker is reserved for compiler-owned Ingresses"
    - expression: >-
        request.operation != 'UPDATE' || variables.target.kind != 'Ingress' ||
        (has(oldObject.metadata.labels) && has(object.metadata.labels) &&
        (('raibitserver.io/preview-route' in oldObject.metadata.labels) == ('raibitserver.io/preview-route' in object.metadata.labels)) &&
        (!('raibitserver.io/preview-route' in oldObject.metadata.labels) ||
        (oldObject.metadata.labels['raibitserver.io/preview-route'] == 'true' && object.metadata.labels['raibitserver.io/preview-route'] == 'true' &&
        ['app.kubernetes.io/name', 'raibitserver.io/project-id', 'raibitserver.io/service-id', 'raibitserver.io/preview-lineage-id'].all(key,
          key in oldObject.metadata.labels && key in object.metadata.labels && object.metadata.labels[key] == oldObject.metadata.labels[key]) &&
        (['raibitserver.io/deployment-id', 'raibitserver.io/preview-generation', 'raibitserver.io/preview-backend-service'].all(key, object.metadata.labels[key] == oldObject.metadata.labels[key]) ||
        ['raibitserver.io/deployment-id', 'raibitserver.io/preview-generation', 'raibitserver.io/preview-backend-service'].all(key, object.metadata.labels[key] != oldObject.metadata.labels[key])))))
      message: "preview Ingresses preserve route lineage and atomically retarget current candidate provenance"
    - expression: >-
        !variables.isPodWorkload ||
        (variables.podTemplate.metadata.labels == variables.target.metadata.labels &&
        has(variables.podTemplate.metadata.annotations) && variables.podTemplate.metadata.annotations.size() == 1 &&
        variables.podTemplate.metadata.annotations['raibitserver.io/verify-image-signatures'] == 'required')
      message: "orchestrator Pod templates must preserve ownership labels and signature verification"
    - expression: >-
        !variables.isPodWorkload ||
        (variables.podSpec.automountServiceAccountToken == false &&
        (!has(variables.podSpec.serviceAccountName) || variables.podSpec.serviceAccountName == 'default') &&
        (!has(variables.podSpec.hostNetwork) || variables.podSpec.hostNetwork == false) &&
        (!has(variables.podSpec.hostPID) || variables.podSpec.hostPID == false) &&
        (!has(variables.podSpec.hostIPC) || variables.podSpec.hostIPC == false) &&
        (!has(variables.podSpec.shareProcessNamespace) || variables.podSpec.shareProcessNamespace == false) &&
        (!has(variables.podSpec.initContainers) || variables.podSpec.initContainers.size() == 0) &&
        (!has(variables.podSpec.ephemeralContainers) || variables.podSpec.ephemeralContainers.size() == 0) &&
        variables.podSpec.securityContext.runAsNonRoot == true &&
        variables.podSpec.securityContext.seccompProfile.type == 'RuntimeDefault' &&
        variables.podSpec.containers.size() == 1)
      message: "orchestrator Pods may not inherit credentials or use host execution surfaces"
    - expression: >-
        !variables.isPodWorkload ||
        (variables.container.name == variables.appName &&
        variables.container.image.matches('^[A-Za-z0-9][A-Za-z0-9._:/-]*@sha256:[a-f0-9]{64}$') &&
        variables.container.imagePullPolicy == 'IfNotPresent' &&
        variables.container.securityContext.allowPrivilegeEscalation == false &&
        variables.container.securityContext.readOnlyRootFilesystem == true &&
        variables.container.securityContext.runAsNonRoot == true &&
        (!has(variables.container.securityContext.privileged) || variables.container.securityContext.privileged == false) &&
        (!has(variables.container.securityContext.procMount) || variables.container.securityContext.procMount == 'Default') &&
        variables.container.securityContext.capabilities.drop.size() == 1 && 'ALL' in variables.container.securityContext.capabilities.drop &&
        (!has(variables.container.securityContext.capabilities.add) || variables.container.securityContext.capabilities.add.size() == 0) &&
        !has(variables.container.envFrom) && !has(variables.container.lifecycle) &&
        (!has(variables.container.stdin) || variables.container.stdin == false) && (!has(variables.container.tty) || variables.container.tty == false))
      message: "orchestrator containers require a signed digest and the restricted runtime contract"
    - expression: >-
        !variables.isPodWorkload ||
        (has(variables.container.resources) && variables.container.resources.requests.size() == 3 && variables.container.resources.limits.size() == 3 &&
        variables.container.resources.requests['cpu'] == '100m' && variables.container.resources.requests['memory'] == '128Mi' &&
        variables.container.resources.requests['ephemeral-storage'] == '64Mi' &&
        variables.container.resources.limits['cpu'] == '500m' && variables.container.resources.limits['memory'] == '512Mi' &&
        variables.container.resources.limits['ephemeral-storage'] == '256Mi' &&
        variables.podSpec.volumes.size() == 1 && variables.podSpec.volumes[0].name == 'tmp' && has(variables.podSpec.volumes[0].emptyDir) &&
        variables.podSpec.volumes[0].emptyDir.sizeLimit == '128Mi' &&
        (!has(variables.podSpec.volumes[0].emptyDir.medium) || variables.podSpec.volumes[0].emptyDir.medium == '') &&
        variables.container.volumeMounts.size() == 1 && variables.container.volumeMounts[0].name == 'tmp' && variables.container.volumeMounts[0].mountPath == '/tmp' &&
        !has(variables.container.volumeMounts[0].subPath) && !has(variables.container.volumeMounts[0].subPathExpr))
      message: "orchestrator workloads require bounded resources and only the compiler-owned tmp volume"
    - expression: >-
        !variables.isPodWorkload || !has(variables.container.env) ||
        (variables.container.env.size() <= 128 && variables.container.env.all(env,
        env.name.matches('^[A-Z_][A-Z0-9_]{0,127}$') &&
        ((has(env.value) && !has(env.valueFrom) && env.value.size() <= 4096) ||
        (!has(env.value) && has(env.valueFrom) && has(env.valueFrom.secretKeyRef) &&
        !has(env.valueFrom.configMapKeyRef) && !has(env.valueFrom.fieldRef) && !has(env.valueFrom.resourceFieldRef) &&
        env.valueFrom.secretKeyRef.name.matches('^[a-z0-9]([-a-z0-9]*[a-z0-9])?$') &&
        env.valueFrom.secretKeyRef.key.matches('^[A-Z_][A-Z0-9_]{0,127}$') &&
        (!has(env.valueFrom.secretKeyRef.optional) || env.valueFrom.secretKeyRef.optional == false)))))
      message: "orchestrator environment variables must be bounded literals or explicit same-namespace Secret keys"
    - expression: >-
        variables.target.kind != 'Deployment' ||
        (variables.target.spec.replicas >= 0 && variables.target.spec.replicas <= 100 &&
        variables.target.spec.selector.matchLabels.size() == 1 && variables.target.spec.selector.matchLabels['app.kubernetes.io/name'] == variables.appName &&
        (!has(variables.target.spec.selector.matchExpressions) || variables.target.spec.selector.matchExpressions.size() == 0))
      message: "orchestrator Deployments require a bounded replica count and exact app selector"
    - expression: >-
        variables.target.kind != 'Job' ||
        (variables.target.spec.backoffLimit == 1 && variables.target.spec.template.spec.restartPolicy == 'Never')
      message: "orchestrator Jobs require the finite retry and restart contract"
    - expression: >-
        variables.target.kind != 'CronJob' ||
        (variables.target.spec.concurrencyPolicy == 'Forbid' && variables.target.spec.successfulJobsHistoryLimit == 1 &&
        variables.target.spec.failedJobsHistoryLimit == 1 && variables.target.spec.jobTemplate.spec.backoffLimit == 1 &&
        variables.target.spec.jobTemplate.spec.template.spec.restartPolicy == 'OnFailure')
      message: "orchestrator CronJobs require the finite concurrency and history contract"
    - expression: >-
        variables.target.kind != 'Service' ||
        (variables.target.metadata.name == variables.appName &&
        (!has(variables.target.spec.type) || variables.target.spec.type == 'ClusterIP') && !has(variables.target.spec.externalName) &&
        (!has(variables.target.spec.externalIPs) || variables.target.spec.externalIPs.size() == 0) &&
        (!has(variables.target.spec.loadBalancerIP) || variables.target.spec.loadBalancerIP == '') &&
        (!has(variables.target.spec.loadBalancerSourceRanges) || variables.target.spec.loadBalancerSourceRanges.size() == 0) &&
        variables.target.spec.selector.size() == 1 && variables.target.spec.selector['app.kubernetes.io/name'] == variables.appName &&
        variables.target.spec.ports.size() == 1 && variables.target.spec.ports[0].name == 'http' &&
        variables.target.spec.ports[0].port >= 1 && variables.target.spec.ports[0].port <= 65535 && variables.target.spec.ports[0].targetPort == 'http' &&
        (!has(variables.target.spec.ports[0].protocol) || variables.target.spec.ports[0].protocol == 'TCP') && !has(variables.target.spec.ports[0].nodePort))
      message: "orchestrator Services must remain compiler-shaped internal ClusterIP services"
    - expression: >-
        variables.target.kind != 'Ingress' ||
        ((!variables.isPreviewRoute &&
        (variables.target.metadata.name == variables.appName && variables.target.metadata.annotations.size() == {{ $ingressAnnotationCount }} &&
        {{- if .Values.hostedErrors.enabled }}
        'nginx.ingress.kubernetes.io/custom-http-errors' in variables.target.metadata.annotations &&
        variables.target.metadata.annotations['nginx.ingress.kubernetes.io/custom-http-errors'] == {{ join "," .Values.hostedErrors.statuses | squote }} &&
        {{- end }}
        {{- if and .Values.hostedErrors.enabled .Values.hostedErrors.traefik.enabled }}
        'traefik.ingress.kubernetes.io/router.middlewares' in variables.target.metadata.annotations &&
        variables.target.metadata.annotations['traefik.ingress.kubernetes.io/router.middlewares'] == {{ printf "%s-%s-hosted-errors@kubernetescrd" .Release.Namespace (include "raibitserver.fullname" .) | squote }} &&
        {{- end }}
        variables.ingressHost.matches('^[a-z0-9]([-a-z0-9]*[a-z0-9])?(\\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)+$') && !variables.ingressHost.startsWith('*.') &&
        !has(variables.target.spec.defaultBackend) && variables.target.spec.ingressClassName == {{ $ingressClassName | squote }} &&
