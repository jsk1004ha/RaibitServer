apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: {{ include "raibitserver.fullname" . }}-provisioner-provider-networkpolicies
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: ["networking.k8s.io"]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["networkpolicies"]
  matchConditions:
    - name: provisioner-service-account
      expression: {{ printf "request.userInfo.username == 'system:serviceaccount:%s:%s-provisioner' && object.metadata.name.endsWith('-provider')" .Release.Namespace (include "raibitserver.fullname" .) | quote }}
  variables:
    - name: providerName
      expression: "object.metadata.labels['app.kubernetes.io/name']"
    - name: provider
