{{- if .Values.dashboard.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "raibitserver.fullname" . }}-dashboard
  labels:
    {{- include "raibitserver.commonLabels" . | nindent 4 }}
    app.kubernetes.io/name: raibitserver-dashboard
    app.kubernetes.io/component: dashboard
spec:
  {{- if not .Values.dashboard.autoscaling.enabled }}
  replicas: {{ .Values.dashboard.replicas }}
  {{- end }}
  selector:
    matchLabels:
      app.kubernetes.io/name: raibitserver-dashboard
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: raibitserver-dashboard
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: dashboard
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: dashboard
          image: "{{ .Values.image.registry }}/raibitserver/dashboard{{ if .Values.image.digests.dashboard }}@{{ .Values.image.digests.dashboard }}{{ else }}:{{ .Values.image.tag }}{{ end }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            - { name: NODE_ENV, value: production }
            - { name: PORT, value: {{ .Values.dashboard.port | quote }} }
            - { name: HOSTNAME, value: "0.0.0.0" }
            - name: RAIBITSERVER_API_URL
              value: {{ printf "http://%s-api:%d/api" (include "raibitserver.fullname" .) (int .Values.api.port) | quote }}
            - name: RAIBITSERVER_CONSOLE_URL
              value: {{ .Values.dashboard.consoleUrl | quote }}
          ports:
            - { name: http, containerPort: {{ .Values.dashboard.port }}, protocol: TCP }
          startupProbe:
            httpGet: { path: /api/health, port: http }
            failureThreshold: 30
            periodSeconds: 2
          readinessProbe:
            httpGet: { path: /api/health, port: http }
            periodSeconds: 10
            timeoutSeconds: 2
          livenessProbe:
            httpGet: { path: /api/health, port: http }
            periodSeconds: 20
            timeoutSeconds: 2
          resources:
            {{- toYaml .Values.dashboard.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 10001
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 128Mi
{{- end }}
