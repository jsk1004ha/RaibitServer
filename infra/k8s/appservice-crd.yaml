apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: appservices.raibitserver.io
spec:
  group: raibitserver.io
  names:
    kind: AppService
    plural: appservices
    singular: appservice
  scope: Namespaced
  versions:
    - name: v1alpha1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              properties:
                image: { type: string }
                port: { type: integer }
                envFromSecret: { type: string }
                serviceType: { type: string, enum: [web, private, worker, cron, job] }
                healthCheckPath: { type: string, nullable: true, maxLength: 1024, pattern: '^/([^/].*)?$' }
                livenessPath: { type: string, nullable: true, maxLength: 1024, pattern: '^/([^/].*)?$' }
                readinessPath: { type: string, nullable: true, maxLength: 1024, pattern: '^/([^/].*)?$' }
                publicHealthPath: { type: string, nullable: true, maxLength: 1024, pattern: '^/([^/].*)?$' }
            status:
              type: object
              properties:
                phase: { type: string }
                url: { type: string }
                publicHealthStatus: { type: string, default: UNKNOWN, enum: [UNKNOWN, CHECKING, HEALTHY, DEGRADED] }
                healthCheckedAt: { type: string, format: date-time, nullable: true }
                healthFailureCode:
                  type: string
                  nullable: true
                  enum: [PUBLIC_HEALTH_INVALID_TARGET, PUBLIC_HEALTH_DNS_FAILED, PUBLIC_HEALTH_UNSAFE_ADDRESS, PUBLIC_HEALTH_CONNECT_FAILED, PUBLIC_HEALTH_TLS_FAILED, PUBLIC_HEALTH_TIMEOUT, PUBLIC_HEALTH_REDIRECT, PUBLIC_HEALTH_HTTP_STATUS, PUBLIC_HEALTH_RESPONSE_TOO_LARGE, PUBLIC_HEALTH_CANCELLED]
                observedGeneration: { type: integer, nullable: true, minimum: 1, maximum: 2147483647 }
