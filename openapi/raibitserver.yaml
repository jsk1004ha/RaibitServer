components:
  schemas:
    AgentInput:
      $schema: https://json-schema.org/draft/2020-12/schema
      type: object
      properties:
        serviceIds:
          maxItems: 100
          type: array
          items:
            type: string
            minLength: 1
        deploymentType:
          type: string
          enum:
            - production
            - preview
        branch:
          type: string
        commitSha:
          type: string
      additionalProperties: false
    AgentPlan:
      $schema: https://json-schema.org/draft/2020-12/schema
      type: object
      properties:
        version:
          type: string
          const: v1
        projectId:
          type: string
          minLength: 1
        generatedBy:
          type: string
          enum:
            - deterministic
            - external-ai
        summary:
          type: string
        blocked:
          type: boolean
        canApply:
          type: boolean
        deploymentOrder:
          type: array
          items:
            type: string
            minLength: 1
        services:
          type: array
          items:
            type: object
            properties:
              serviceId:
                type: string
                minLength: 1
              name:
                type: string
              type:
                type: string
              eligible:
                type: boolean
              findings:
                type: array
                items:
                  type: object
                  properties:
                    severity:
                      type: string
                      enum:
                        - critical
                        - high
                        - medium
                        - low
                    code:
                      type: string
                    message:
                      type: string
