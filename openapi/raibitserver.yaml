            maxLength: 2048
        - name: code
          in: query
          required: false
          schema:
            type: string
            pattern: ^[^\u0000-\u0020\u007f]{1,256}$
        - name: error
          in: query
          required: false
          schema:
            type: string
            const: access_denied
      responses:
        "200":
          description: Successful response
