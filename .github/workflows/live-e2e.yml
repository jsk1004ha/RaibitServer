name: Live E2E

on:
  workflow_dispatch:
    inputs:
      runner_labels_json:
        description: 'JSON array for a Docker-capable Linux runner'
        required: true
        default: '["self-hosted","linux"]'

permissions:
  contents: read

jobs:
  live-e2e:
    name: kind / Helm reconciliation gate
    runs-on: ${{ fromJSON(inputs.runner_labels_json) }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
      - uses: pnpm/action-setup@v4
        with:
          version: 11.1.2
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
      - uses: azure/setup-kubectl@v4
        with:
          version: v1.35.0
      - uses: azure/setup-helm@v4
        with:
          version: v4.2.3
      - name: Install pinned kind
        run: |
          go install sigs.k8s.io/kind@v0.31.0
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: Verify live gate tools
        run: |
          docker version
          kind version
          kubectl version --client=true
          helm version
          go version
          curl --version
          base64 --version
      - name: Run public live Helm command
        run: pnpm e2e:live
