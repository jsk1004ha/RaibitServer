# Example locally-managed Cloudflare Tunnel config for RAIBITSERVER.
# Replace <TUNNEL_UUID>, credential path, origin address, and raibitserver.app
# before use. Run cloudflared on a host that can reach the internal Traefik
# websecure endpoint.
#
# Generated tenant routes are deliberately flattened to one DNS label under the
# base domain (for example apps--org--project.raibitserver.app). This keeps every
# generated route inside the free Universal SSL wildcard *.raibitserver.app.
# Do not add per-service tunnel rules; route one wildcard to Traefik and let
# Kubernetes Ingress perform the final Host match.

tunnel: <TUNNEL_UUID>
credentials-file: /etc/cloudflared/<TUNNEL_UUID>.json

originRequest:
  connectTimeout: 30s
  noHappyEyeballs: true

ingress:
  # Platform control plane.
  - hostname: api.raibitserver.app
    service: https://<TRAEFIK_ORIGIN>:443
    originRequest:
      originServerName: api.raibitserver.app
      httpHostHeader: api.raibitserver.app

  - hostname: console.raibitserver.app
    service: https://<TRAEFIK_ORIGIN>:443
    originRequest:
      originServerName: console.raibitserver.app
      httpHostHeader: console.raibitserver.app

  # All generated tenant app/preview/console/resource hostnames are exactly one
  # label below the base domain. Kubernetes Ingress owns the final Host match.
  - hostname: "*.raibitserver.app"
    service: https://<TRAEFIK_ORIGIN>:443
    originRequest:
      noTLSVerify: true

  # Never expose PostgreSQL/MySQL/Redis/registry/Kubernetes API ports here.
  - service: http_status:404
